# /etc/nginx/sites-available/hygiene (deploy/deploy.sh 가 바뀌었을 때만 복사하고 nginx -t 통과 시 reload)
# - 프론트 빌드 결과(frontend/dist → /var/www/hygiene-finder)를 정적 서빙
# - /api 는 FastAPI(127.0.0.1:8000)로 프록시
# - HTTPS: Let's Encrypt (certbot certonly --webroot), 도메인은 sslip.io 형식
#   인증서 경로가 바뀌면 아래 DOMAIN 부분(server_name, ssl_certificate*)을 함께 바꾼다.

# HTTP: 인증서 발급/갱신용 경로만 열어 두고 나머지는 HTTPS 로 리다이렉트
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://15-165-113-119.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 15-165-113-119.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/15-165-113-119.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/15-165-113-119.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=86400" always;

    root /var/www/hygiene-finder;   # frontend/dist 내용을 복사할 위치
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router(SPA) 새로고침 대응
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
