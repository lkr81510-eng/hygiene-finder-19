# 예시: /etc/nginx/conf.d/hygiene.conf
# 프론트 빌드 결과(frontend/dist)를 정적 서빙하고, /api 는 FastAPI(127.0.0.1:8000)로 프록시한다.
server {
    listen 80;
    server_name _;

    root /var/www/hygiene-finder;   # frontend/dist 내용을 복사할 위치
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router(SPA) 새로고침 대응
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
